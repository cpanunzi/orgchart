# Pings the Supabase project daily so the free tier never pauses it for inactivity.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://vibzhaqqgfjoiekqnvfr.supabase.co/rest/v1/charts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          [ "$code" = "200" ]
